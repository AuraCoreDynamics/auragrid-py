[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auragrid"
version = "4.3.0"
description = "AuraGrid Python SDK - decorators, descriptor generation, lifecycle, collaborative processing, and IPC cell API client for Python MAS development"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "cryptography>=42.0",
    "auragrid-api>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.34",
    "jsonschema>=4.20",
]

[project.scripts]
auragrid = "auragrid.cli:main"

[tool.setuptools.packages.find]
include = ["auragrid*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "sovereignty: live unmocked loopback HTTP conformance tests",
]
