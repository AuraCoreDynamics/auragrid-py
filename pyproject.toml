[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auragrid"
version = "4.0.0"
description = "AuraGrid Python SDK - decorators, descriptor generation, and lifecycle for Python MAS development"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
auragrid = "auragrid.cli:main"

[tool.setuptools.packages.find]
include = ["auragrid*"]
